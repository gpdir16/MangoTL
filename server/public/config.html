<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>MangoTL Server Settings</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
                color: white;
                background: black;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                min-height: 100dvh;
            }

            h1 {
                font-weight: 500;
            }

            .topbar {
                padding: 6px 20px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .topbar h1 {
                margin: 0;
                font-size: 18px;
            }

            button {
                border: 0;
                border-radius: 8px;
                background: dodgerblue;
                cursor: pointer;
                padding: 10px 12px;
            }

            button:hover {
                filter: opacity(0.9);
            }

            button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            .secondary-btn {
                background: rgba(255, 255, 255, 0.15);
                font-weight: 500;
            }

            .layout {
                flex: 1;
                display: grid;
                grid-template-columns: 200px 1fr;
            }

            .layout > * {
                min-width: 0;
            }

            .sidebar {
                border-right: 1px solid rgba(255, 255, 255, 0.1);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            #help-btn {
                margin-top: auto;
            }

            .sidebar .tab {
                padding: 8px 10px;
                background: transparent;
                color: rgb(200, 200, 200);
                text-align: left;
            }

            .sidebar .tab:hover {
                background: rgba(255, 255, 255, 0.08);
                color: white;
            }

            .sidebar .tab.active {
                background: rgba(30, 144, 255, 0.15);
                color: #64b5f6;
            }

            .content {
                padding: 28px 32px;
                max-width: 720px;
            }

            .panel {
                display: none;
            }

            .panel.active {
                display: grid;
                gap: 16px;
            }

            .panel h2 {
                margin: 0;
                font-size: 20px;
            }

            .panel .desc {
                margin: -8px 0 4px;
                color: rgb(180, 180, 180);
                font-size: 14px;
            }

            .field {
                display: grid;
                gap: 8px;
            }

            .field label {
                display: grid;
                gap: 8px;
                color: rgb(230, 230, 230);
                font-size: 14px;
            }

            .field-row {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .field-row input,
            .field-row select {
                flex: 1;
                min-width: 0;
            }

            input,
            select {
                min-height: 36px;
                border: none;
                border-radius: 8px;
                padding: 0 10px;
                background: rgba(255, 255, 255, 0.15);
                color: white;
                font: inherit;
            }

            input:focus,
            select:focus {
                outline: 2px solid dodgerblue;
                background: rgba(255, 255, 255, 0.2);
            }

            .key-preview {
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 13px;
                color: rgb(180, 180, 180);
            }

            .hint {
                margin: 0;
                color: rgb(160, 160, 160);
                font-size: 12px;
            }

            #message {
                font-size: 13px;
            }

            #message.error {
                color: #ef9a9a;
            }

            #message.success {
                color: #81c784;
            }

            @media (max-width: 640px) {
                .layout {
                    display: flex;
                    flex-direction: column;
                    min-height: 0;
                }

                .sidebar {
                    flex-direction: row;
                    align-items: center;
                    border-right: 0;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                    overflow-x: auto;
                    position: sticky;
                    top: 0;
                    z-index: 1;
                    background: black;
                }

                .sidebar .tab {
                    white-space: nowrap;
                }

                #help-btn {
                    margin-top: 0;
                    margin-left: auto;
                }

                .topbar {
                    padding: 6px 12px;
                }

                .topbar h1 {
                    font-size: 16px;
                }

                .content {
                    padding: 16px;
                }

                .panel.active {
                    gap: 12px;
                }

                .field-row {
                    gap: 6px;
                }
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <h1 data-i18n="pageTitle">MangoTL Server Settings</h1>
        </header>

        <div class="layout">
            <nav class="sidebar" aria-label="Settings tabs">
                <button type="button" class="tab active" data-tab="inference" data-i18n="tabInference">AI Inference</button>
                <button type="button" class="tab" data-tab="advanced" data-i18n="tabAdvanced">Advanced</button>
                <button type="button" id="help-btn" class="tab" data-i18n="help">Open README Help</button>
            </nav>

            <main class="content">
                <section id="panel-inference" class="panel active">
                    <h2 data-i18n="tabInference">AI Inference</h2>
                    <p class="desc" data-i18n="descInference">Configure the AI provider and model used to translate images.</p>

                    <div class="field">
                        <label data-i18n="labelProvider">Provider</label>
                        <div class="field-row">
                            <select id="provider"></select>
                            <button type="button" class="field-save" data-save="provider" hidden data-i18n="save">Save</button>
                        </div>
                        <p id="provider-hint" class="hint"></p>
                    </div>

                    <div class="field">
                        <label data-i18n="labelModel">Model</label>
                        <div class="field-row">
                            <input id="model" type="text" required />
                            <button type="button" class="field-save" data-save="model" hidden data-i18n="save">Save</button>
                        </div>
                    </div>

                    <div class="field">
                        <label data-i18n="labelApiKey">API key</label>
                        <div id="key-preview-wrap" class="field-row">
                            <span id="key-preview" class="key-preview"></span>
                            <button type="button" id="key-toggle-btn" class="secondary-btn"></button>
                        </div>
                        <div id="key-input-wrap" class="field-row" hidden>
                            <input id="apiKey" type="password" autocomplete="off" />
                            <button type="button" class="field-save" data-save="apiKey" hidden data-i18n="save">Save</button>
                            <button type="button" id="key-cancel-btn" class="secondary-btn" data-i18n="cancel">Cancel</button>
                        </div>
                        <p id="api-key-hint" class="hint"></p>
                    </div>
                </section>

                <section id="panel-advanced" class="panel">
                    <h2 data-i18n="tabAdvanced">Advanced</h2>
                    <p class="desc" data-i18n="descAdvanced">Advanced settings that affect server behavior.</p>

                    <div class="field">
                        <label data-i18n="labelMaxImageBytes">Max image size (bytes)</label>
                        <div class="field-row">
                            <input id="maxImageBytes" type="number" min="1" />
                            <button type="button" class="field-save" data-save="maxImageBytes" hidden data-i18n="save">Save</button>
                        </div>
                        <p id="max-hint" class="hint"></p>
                    </div>

                    <div class="field">
                        <label>
                            <span data-i18n="labelPort">Server port</span>
                            <span class="hint" data-i18n="hintPort">Changes apply after a server restart.</span>
                        </label>
                        <div class="field-row">
                            <input id="port" type="number" min="1" />
                            <button type="button" class="field-save" data-save="port" hidden data-i18n="save">Save</button>
                        </div>
                    </div>
                </section>

                <p id="message" role="status"></p>
            </main>
        </div>

        <script>
            const I18N = {
                en: {
                    pageTitle: "MangoTL Server Settings",
                    help: "Open README Help",
                    save: "Save",
                    tabInference: "AI Inference",
                    tabAdvanced: "Advanced",
                    descInference: "Configure the AI provider and model used to translate images.",
                    descAdvanced: "Advanced settings that affect server behavior.",
                    labelProvider: "Provider",
                    labelModel: "Model",
                    labelApiKey: "API key",
                    labelMaxImageBytes: "Max image size (bytes)",
                    labelPort: "Server port",
                    hintPort: "Changes apply after a server restart.",
                    hintProviderLocal: "Runs locally — no API key required.",
                    hintApiKeySet: "A key is saved. Enter a new one to replace it.",
                    hintApiKeyNotSet: "Enter the API key for this provider.",
                    placeholderKeySet: "New key (leave blank to keep the saved key)",
                    placeholderKeyNotSet: "Enter the API key",
                    placeholderModel: "e.g. openai/gpt-4o-mini",
                    changeKey: "Change",
                    setKey: "Set key",
                    cancel: "Cancel",
                    mbHint: "≈ {mb} MB",
                    saveSuccess: "Successfully applied server settings.",
                    saveSuccessPort: "Successfully applied server settings — a server restart is required to apply the new port.",
                    saveError: "Failed to save settings: ",
                },
                ko: {
                    pageTitle: "MangoTL 서버 설정",
                    help: "README 도움말 열기",
                    save: "저장",
                    tabInference: "인공지능 추론",
                    tabAdvanced: "고급",
                    descInference: "이미지 번역에 사용할 AI 제공자와 모델을 설정합니다.",
                    descAdvanced: "서버 동작에 영향을 주는 세부 설정입니다.",
                    labelProvider: "제공자",
                    labelModel: "모델",
                    labelApiKey: "API 키",
                    labelMaxImageBytes: "이미지 최대 크기 (바이트)",
                    labelPort: "서버 포트",
                    hintPort: "변경은 서버 재시작 후 적용됩니다.",
                    hintProviderLocal: "로컬 실행 제공자 — API 키가 필요 없습니다.",
                    hintApiKeySet: "이미 저장된 키가 있습니다. 새 키를 입력하면 교체됩니다.",
                    hintApiKeyNotSet: "이 제공자의 API 키를 입력하세요.",
                    placeholderKeySet: "새 키 (비워두면 저장된 키 유지)",
                    placeholderKeyNotSet: "API 키 입력",
                    placeholderModel: "예: openai/gpt-4o-mini",
                    changeKey: "변경",
                    setKey: "키 설정",
                    cancel: "취소",
                    mbHint: "약 {mb} MB",
                    saveSuccess: "성공적으로 서버 설정을 적용했습니다.",
                    saveSuccessPort: "성공적으로 서버 설정을 적용했으며 포트 적용을 위해 서버 재시작이 필요합니다.",
                    saveError: "설정 저장에 실패했습니다: ",
                },
            };

            // Like the extension, the page language follows the browser language.
            const lang = (navigator.language || "en").toLowerCase().startsWith("ko") ? "ko" : "en";

            let apiKeySet = false;
            let apiKeyPreview = "";
            let keyInputOpen = false;
            let originalPort = null;
            let original = null;

            const messageEl = document.getElementById("message");
            const keyInput = document.getElementById("apiKey");
            const keyToggleBtn = document.getElementById("key-toggle-btn");
            const keyCancelBtn = document.getElementById("key-cancel-btn");
            const keyPreviewEl = document.getElementById("key-preview");
            const keyPreviewWrap = document.getElementById("key-preview-wrap");
            const keyInputWrap = document.getElementById("key-input-wrap");

            function t(key) {
                return I18N[lang][key];
            }

            function numOr(raw, fallback) {
                const parsed = Number(raw);
                return Number.isSafeInteger(parsed) && parsed > 0 ? parsed : fallback;
            }

            function maskApiKey(apiKey) {
                if (!apiKey) {
                    return "";
                }

                // Prefix (everything up to and including the last dash) never counts toward
                // the revealed characters — only the actual key part does, and only 4 of it.
                const dashIndex = apiKey.lastIndexOf("-");
                const prefix = dashIndex >= 0 ? apiKey.slice(0, dashIndex + 1) : "";
                const keyPart = dashIndex >= 0 ? apiKey.slice(dashIndex + 1) : apiKey;

                if (keyPart.length <= 4) {
                    return `${prefix}${"•".repeat(keyPart.length)}`;
                }

                // Mask length mirrors the real remaining key length.
                return `${prefix}${keyPart.slice(0, 4)}${"•".repeat(keyPart.length - 4)}`;
            }

            // Normalized form state: empty number fields fall back to the saved value,
            // so clearing them counts as "no change".
            function formSnapshot() {
                const saved = original || {};
                return {
                    provider: document.getElementById("provider").value,
                    model: document.getElementById("model").value.trim(),
                    maxImageBytes: numOr(document.getElementById("maxImageBytes").value, saved.maxImageBytes ?? ""),
                    port: numOr(document.getElementById("port").value, saved.port ?? ""),
                };
            }

            function updateFieldButtons() {
                const snapshot = formSnapshot();
                for (const key of ["provider", "model", "maxImageBytes", "port"]) {
                    const button = document.querySelector(`[data-save="${key}"]`);
                    button.hidden = snapshot[key] === (original || {})[key];
                }
                document.querySelector('[data-save="apiKey"]').hidden = !(keyInputOpen && keyInput.value.trim() !== "");
            }

            function applyLang() {
                document.documentElement.lang = lang;
                document.title = t("pageTitle");
                document.querySelectorAll("[data-i18n]").forEach((el) => {
                    el.textContent = t(el.dataset.i18n);
                });
                refreshDynamicTexts();
            }

            function refreshDynamicTexts() {
                const provider = document.getElementById("provider");
                const keyOptional = provider.selectedOptions[0]?.dataset.keyOptional === "true";
                document.getElementById("provider-hint").textContent = keyOptional ? t("hintProviderLocal") : "";

                keyPreviewEl.textContent = apiKeyPreview;
                keyPreviewWrap.hidden = keyInputOpen || !apiKeySet;
                keyInputWrap.hidden = !keyInputOpen;
                keyToggleBtn.hidden = keyInputOpen;
                keyToggleBtn.textContent = apiKeySet ? t("changeKey") : t("setKey");
                keyCancelBtn.hidden = !keyInputOpen;
                keyInput.placeholder = apiKeySet ? t("placeholderKeySet") : t("placeholderKeyNotSet");

                const hint = document.getElementById("api-key-hint");
                if (keyInputOpen) {
                    hint.textContent = apiKeySet ? t("hintApiKeySet") : t("hintApiKeyNotSet");
                } else {
                    hint.textContent = apiKeySet ? "" : t("hintApiKeyNotSet");
                }

                const bytes = Number(document.getElementById("maxImageBytes").value);
                document.getElementById("max-hint").textContent = bytes > 0 ? t("mbHint").replace("{mb}", (bytes / (1024 * 1024)).toFixed(1)) : "";
            }

            let messageTimer = null;

            function showMessage(text, kind) {
                messageEl.textContent = text;
                messageEl.className = kind || "";
                if (kind === "success") {
                    clearTimeout(messageTimer);
                    messageTimer = setTimeout(() => {
                        messageEl.textContent = "";
                        messageEl.className = "";
                    }, 4000);
                }
            }

            async function loadSettings() {
                const response = await fetch("/api/settings");
                const data = await response.json();

                const providers = document.getElementById("provider");
                providers.textContent = "";
                for (const p of data.providers) {
                    const option = document.createElement("option");
                    option.value = p.id;
                    option.textContent = p.name;
                    option.dataset.keyOptional = String(p.apiKeyOptional);
                    providers.append(option);
                }
                providers.value = data.settings.provider;

                document.getElementById("model").value = data.settings.model;
                document.getElementById("model").placeholder = t("placeholderModel");
                document.getElementById("maxImageBytes").value = data.settings.maxImageBytes || "";
                document.getElementById("port").value = data.settings.port;

                apiKeySet = data.settings.apiKeySet;
                apiKeyPreview = data.settings.apiKeyPreview || "";
                originalPort = data.settings.port;
                keyInputOpen = false;
                keyInput.value = "";

                original = formSnapshot();
                refreshDynamicTexts();
                updateFieldButtons();
            }

            async function saveField(key) {
                const snapshot = formSnapshot();
                const payload = {};
                let portChanged = false;

                if (key === "apiKey") {
                    payload.apiKey = keyInput.value.trim();
                } else {
                    payload[key] = snapshot[key];
                    if (key === "port" && snapshot.port !== "" && originalPort !== null && snapshot.port !== originalPort) {
                        portChanged = true;
                    }
                }

                const button = document.querySelector(`[data-save="${key}"]`);
                button.disabled = true;
                let response;
                try {
                    response = await fetch("/api/settings", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });
                } catch {
                    button.disabled = false;
                    showMessage(t("saveError"), "error");
                    return;
                }
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    button.disabled = false;
                    showMessage(t("saveError") + (data.message || ""), "error");
                    return;
                }

                if (key === "apiKey") {
                    apiKeySet = true;
                    apiKeyPreview = maskApiKey(keyInput.value.trim());
                    keyInputOpen = false;
                    keyInput.value = "";
                } else {
                    original[key] = snapshot[key];
                    if (key === "port") {
                        originalPort = snapshot.port;
                    }
                }

                refreshDynamicTexts();
                updateFieldButtons();
                showMessage(portChanged ? t("saveSuccessPort") : t("saveSuccess"), "success");
            }

            const HASH_BY_TAB = { inference: "ai", advanced: "advanced" };
            const TAB_BY_HASH = { ai: "inference", advanced: "advanced" };

            function activateTab(tabId) {
                document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item.dataset.tab === tabId));
                document.querySelectorAll(".panel").forEach((panel) => {
                    panel.classList.toggle("active", panel.id === `panel-${tabId}`);
                });
            }

            function tabFromHash() {
                return TAB_BY_HASH[location.hash.slice(1)] || "inference";
            }

            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", () => {
                    const tabId = tab.dataset.tab;
                    activateTab(tabId);
                    if (location.hash !== `#${HASH_BY_TAB[tabId]}`) {
                        location.hash = HASH_BY_TAB[tabId];
                    }
                });
            });

            window.addEventListener("hashchange", () => activateTab(tabFromHash()));
            activateTab(tabFromHash());

            document
                .getElementById("help-btn")
                .addEventListener("click", () =>
                    window.open(`https://github.com/gpdir16/MangoTL/blob/main/${lang === "ko" ? "README_ko.md" : "README.md"}`, "_blank", "noopener"),
                );

            document.getElementById("provider").addEventListener("change", updateFieldButtons);
            for (const id of ["model", "apiKey", "maxImageBytes", "port"]) {
                document.getElementById(id).addEventListener("input", updateFieldButtons);
            }

            document.querySelectorAll(".field-save").forEach((button) => {
                button.addEventListener("click", () => saveField(button.dataset.save));
            });

            keyToggleBtn.addEventListener("click", () => {
                keyInputOpen = true;
                refreshDynamicTexts();
                updateFieldButtons();
            });
            keyCancelBtn.addEventListener("click", () => {
                keyInputOpen = false;
                keyInput.value = "";
                refreshDynamicTexts();
                updateFieldButtons();
            });

            loadSettings();
            applyLang();
        </script>
    </body>
</html>
