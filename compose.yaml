services:
    mangotl:
        build: .
        environment:
            LOCAL_GGUF_MODE: native
            LOCAL_GGUF_BINARY: /app/llama-server
            LOCAL_GGUF_CACHE: /app/server/.llama-cache
            LOCAL_GGUF_GPU_LAYERS: "0"
            LOCAL_GGUF_PARALLEL: ${LOCAL_GGUF_PARALLEL:-2}
            MALLOC_MMAP_THRESHOLD_: "131072"
            MALLOC_TRIM_THRESHOLD_: "131072"
            MALLOC_ARENA_MAX: "2"
            MANGOTL_ORT_THREADS: ${MANGOTL_ORT_THREADS:-4}
            MANGOTL_OCR_IDLE_UNLOAD_SECONDS: ${MANGOTL_OCR_IDLE_UNLOAD_SECONDS:-300}
        ports:
            - "8787:8787"
        volumes:
            - mangotl-secrets:/app/server/secrets
            - mangotl-ocr-cache:/app/server/.ocr-cache
            - mangotl-llama-cache:/app/server/.llama-cache

volumes:
    mangotl-secrets:
    mangotl-ocr-cache:
    mangotl-llama-cache:
